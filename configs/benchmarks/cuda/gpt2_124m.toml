# First short CUDA run on a rented GPU. Override batch size from the CLI.
[model]
vocab_size = 50257
context_length = 1024
d_model = 768
num_layers = 12
num_heads = 12
dropout = 0.0
attention_backend = "sdpa"

[benchmark]
batch_size = 1
sequence_length = 128
warmup_iterations = 10
iterations = 50
learning_rate = 3e-4
seed = 2137
device = "cuda"
dtype = "float32"
