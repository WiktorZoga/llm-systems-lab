[model]
vocab_size = 50257
context_length = 32
d_model = 128
num_layers = 2
num_heads = 4
dropout = 0.0

[data]
train_path = "data/processed/shakespeare/train.pt"
val_path = "data/processed/shakespeare/val.pt"
tokenizer = "gpt2"

[train]
batch_size = 8
sequence_length = 32
micro_batch_size = 8
learning_rate = 3e-4
max_steps = 1500
seed = 2137
device = "mps"
dtype = "float32"
shuffle = false

[eval]
interval = 100
num_batches = 20

[checkpoint]
interval = 500

[run]
name = "gpt-tiny-overfit"
output_dir = "artifacts/runs"
